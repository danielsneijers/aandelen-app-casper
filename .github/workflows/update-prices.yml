name: Koersen bijwerken

on:
  schedule:
    # 18:10 UTC op werkdagen: Euronext Amsterdam sluit om 17:30 CET,
    # dus de slotkoers van die dag staat er dan in.
    - cron: '10 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Geen npm install nodig: het script gebruikt alleen ingebouwde Node-dingen.
      #
      # Het probeert eerst de Financial Times en dan Yahoo. Lukt geen van beide,
      # dan blijft de bestaande prices.json staan en stopt dit stapje zonder
      # fout. Morgen gewoon weer.
      - run: npm run prices

      - name: Vastleggen
        id: commit
        run: |
          if [[ -z "$(git status --porcelain src/data/prices.json)" ]]; then
            echo "Geen nieuwe koers."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/prices.json
          git commit -m "Koersen bijgewerkt"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Een push door de workflow zelf start géén andere workflow, dus roepen we
  # de deploy hier expliciet aan.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
