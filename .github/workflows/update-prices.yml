name: Koersen bijwerken

on:
  schedule:
    # 04:00 UTC, dinsdag t/m zaterdag. Dat is 06:00 in de zomer en 05:00 in de
    # winter: ruim voordat Casper wakker wordt, dus 's ochtends staat de
    # slotkoers van de vórige beursdag er altijd al in.
    #
    # Waarom 's ochtends en niet 's avonds? VUSA sluit in Amsterdam om 17:30,
    # maar de S&P 500 handelt in New York door tot 22:00 onze tijd. Die laatste
    # uren zitten dus niet in de slotkoers van vandaag — die komen morgenochtend
    # pas in de koers. Later op de avond draaien levert daarom niets extra's op,
    # en zou te dicht op bedtijd komen.
    #
    # Waarom dinsdag t/m zaterdag? Elke run haalt de vorige beursdag op. De
    # zaterdagrun pakt dus de slotkoers van vrijdag, zodat het weekend — als
    # hij er tijd voor heeft — geen oude donderdagkoers laat zien.
    - cron: '0 4 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Geen npm install nodig: het script gebruikt alleen ingebouwde Node-dingen.
      #
      # Het probeert eerst de Financial Times en dan Yahoo. Lukt geen van beide,
      # dan blijft de bestaande prices.json staan en stopt dit stapje zonder
      # fout. Morgen gewoon weer.
      - run: npm run prices

      - name: Vastleggen
        id: commit
        run: |
          if [[ -z "$(git status --porcelain src/data/prices.json)" ]]; then
            echo "Geen nieuwe koers."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/prices.json
          git commit -m "Koersen bijgewerkt"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Een push door de workflow zelf start géén andere workflow, dus roepen we
  # de deploy hier expliciet aan.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
